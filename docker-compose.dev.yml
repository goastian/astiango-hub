services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: goastian/astiango-hub-backend:${ASTIANGO_TAG:-develop}
    env_file:
      - .env.local

  frontend:
    build:
      context: ./frontend
    image: goastian/astiango-hub-frontend:${ASTIANGO_TAG:-develop}
    env_file:
      - .env.local

  base-image:
    build:
      context: ./docker/base-image
    image: goastian/astiango-hub-base:${ASTIANGO_TAG:-develop}
    env_file:
      - .env.local

  astiango-hub:
    build:
      context: .
      args:
        ASTIANGO_TAG: ${ASTIANGO_TAG:-develop}
    image: goastian/astiango-hub:${ASTIANGO_TAG:-develop}
    depends_on:
      - backend
      - frontend
      - base-image
    env_file:
      - .env.local

  master:
    image: goastian/astiango-hub:${ASTIANGO_TAG:-develop}
    environment:
      ASTIANGO_NODE_MASTER: "Y"
      ASTIANGO_MONGO_HOST: "mongo"
      ASTIANGO_JWT_KEYSET: ${ASTIANGO_JWT_KEYSET:?ASTIANGO_JWT_KEYSET must be injected from a secret manager}
      ASTIANGO_AUTH_KEY: ${ASTIANGO_AUTH_KEY:?ASTIANGO_AUTH_KEY must be injected from a secret manager}
      ASTIANGO_ENCRYPTION_KEYSET: ${ASTIANGO_ENCRYPTION_KEYSET:?ASTIANGO_ENCRYPTION_KEYSET must be injected from a secret manager}
      ASTIANGO_TASK_SANDBOX_WORKSPACE_HOST: ${ASTIANGO_TASK_SANDBOX_WORKSPACE_HOST:?must be the Docker-host path for the shared workspace}
      ASTIANGO_WORKSPACE: /workspace
      ASTIANGO_BOOTSTRAP_ADMIN_USERNAME: ${ASTIANGO_BOOTSTRAP_ADMIN_USERNAME:?ASTIANGO_BOOTSTRAP_ADMIN_USERNAME is required for the first start}
      ASTIANGO_BOOTSTRAP_ADMIN_PASSWORD: ${ASTIANGO_BOOTSTRAP_ADMIN_PASSWORD:?ASTIANGO_BOOTSTRAP_ADMIN_PASSWORD is required for the first start}
    ports:
      - "${ASTIANGO_PORT:-8082}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${ASTIANGO_TASK_SANDBOX_WORKSPACE_HOST:?must be the Docker-host path for the shared workspace}:/workspace
    depends_on:
      - mongo
    env_file:
      - .env.local

  worker:
    image: goastian/astiango-hub:${ASTIANGO_TAG:-develop}
    environment:
      ASTIANGO_NODE_MASTER: "N"
      ASTIANGO_MASTER_HOST: "master"
      ASTIANGO_JWT_KEYSET: ${ASTIANGO_JWT_KEYSET:?ASTIANGO_JWT_KEYSET must be injected from a secret manager}
      ASTIANGO_AUTH_KEY: ${ASTIANGO_AUTH_KEY:?ASTIANGO_AUTH_KEY must be injected from a secret manager}
      ASTIANGO_ENCRYPTION_KEYSET: ${ASTIANGO_ENCRYPTION_KEYSET:?ASTIANGO_ENCRYPTION_KEYSET must be injected from a secret manager}
      ASTIANGO_TASK_SANDBOX_WORKSPACE_HOST: ${ASTIANGO_TASK_SANDBOX_WORKSPACE_HOST:?must be the Docker-host path for the shared workspace}
      ASTIANGO_WORKSPACE: /workspace
    depends_on:
      master:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${ASTIANGO_TASK_SANDBOX_WORKSPACE_HOST:?must be the Docker-host path for the shared workspace}:/workspace
    env_file:
      - .env.local

  mongo:
    image: mongo:5
